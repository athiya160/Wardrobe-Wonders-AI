services:
  - type: web
    name: wardrobe-wonders-backend
    env: node
    plan: free
    rootDir: dress_rental_backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://wardrobe-wonders-ai.vercel.app,http://localhost:5173
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_NAME
        value: qwen/qwen3.8-27b
